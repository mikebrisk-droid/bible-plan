<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

			var theme = null;
			try { theme = localStorage.getItem('lamp-theme'); } catch (e) {}

			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
	<link rel="stylesheet" href="style.css">
</head>
<body data-view="home">

<svg class="sprite" aria-hidden="true">
	<symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.2 12 3.5l8.5 6.7V20a1 1 0 0 1-1 1H15v-6.2H9V21H4.5a1 1 0 0 1-1-1z"/></symbol>
	<symbol id="i-plans" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
	<symbol id="i-create" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></symbol>
	<symbol id="i-myplan" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4M9 15l2 2 4-4"/></symbol>
	<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
	<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></symbol>
	<symbol id="i-book" viewBox="0 0 24 24"><path d="M2.5 5.5c2.5-1 6-1.2 9.5 1 3.5-2.2 7-2 9.5-1V19c-2.5-1-6-1.2-9.5 1-3.5-2.2-7-2-9.5-1z"/><path d="M12 6.5V20"/></symbol>

</svg>

<div class="app">

	<header class="appbar">
		<div class="appbar-blur" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
		<a class="brand" href="#home" aria-label="Read the Bible, home"><span class="logo" aria-hidden="true"></span></a>

		<nav class="tabbar" aria-label="Main">
			<a class="tab" href="#home" data-tab="home"><svg class="icon"><use href="#i-home"/></svg><span>Home</span></a>
			<a class="tab" href="#plans" data-tab="plans"><svg class="icon"><use href="#i-plans"/></svg><span>Plans</span></a>
			<a class="tab" href="#create" data-tab="create"><svg class="icon"><use href="#i-create"/></svg><span>Create</span></a>
			<a class="tab" href="#plan" data-tab="plan"><svg class="icon"><use href="#i-myplan"/></svg><span>My plan</span></a>
		</nav>

		<button type="button" class="icon-btn js-theme-toggle" aria-label="Switch theme">
			<svg class="icon icon-sun"><use href="#i-sun"/></svg>
			<svg class="icon icon-moon"><use href="#i-moon"/></svg>
		</button>
	</header>

	<main>
		<section class="view" id="view-home" aria-label="Home"></section>

		<section class="view" id="view-plans" aria-label="Plans" hidden></section>

		<section class="view" id="view-create" aria-label="Create a plan" hidden></section>

		<section class="view" id="view-plan" aria-label="My plan" hidden>
			<div class="plan-empty" hidden></div>

			<div class="plan-body">
				<div class="chips plan-switch" role="group" aria-label="Your plans" data-anim hidden></div>
				<header class="plan-head" data-anim>
					<div class="plan-head-text">
						<h1 id="plan-name">My plan</h1>
						<p id="plan-sub" class="muted"></p>
					</div>
					<div class="plan-menu">
						<button type="button" class="icon-btn plan-more" aria-label="Plan options" aria-haspopup="true" aria-expanded="false" aria-controls="plan-actions"><svg class="icon"><use href="#i-more"/></svg></button>
						<div class="plan-actions" id="plan-actions">
							<a class="btn btn-quiet" href="#create" data-edit-plan><svg class="icon"><use href="#i-edit"/></svg><span>Edit</span></a>
							<button type="button" class="btn btn-quiet" data-open-sheet="display-sheet"><svg class="icon"><use href="#i-sliders"/></svg><span>Display</span></button>
							<button type="button" class="btn btn-quiet" data-open-sheet="export-sheet"><svg class="icon"><use href="#i-download"/></svg><span>Save</span></button>
							<button type="button" class="btn btn-quiet js-remove-plan"><svg class="icon"><use href="#i-trash"/></svg><span>Remove</span></button>
						</div>
					</div>
				</header>

				<div class="progress-card" data-anim>
					<div class="progress-text">
						<strong id="plan-progress-count">0</strong>
						<span id="plan-progress-label" class="muted">read</span>
					</div>
					<div class="progress-track"><span class="progress-fill" id="plan-progress-fill"></span></div>
					<button type="button" class="link-btn" id="jump-today">Jump to today <svg class="icon"><use href="#i-arrow"/></svg></button>
				</div>

				<div class="segmented layout-switch" role="radiogroup" aria-label="Layout" data-anim>
					<button type="button" role="radio" data-format="list">List</button>
					<button type="button" role="radio" data-format="weeks">Weeks</button>
					<button type="button" role="radio" data-format="calendar">Calendar</button>
					<button type="button" role="radio" data-format="books">Books</button>
					<button type="button" role="radio" data-format="circle" hidden>Wheel</button>
					<button type="button" role="radio" data-format="circlecal" hidden>Year wheel</button>
					<span class="seg-sep" aria-hidden="true"></span>
					<button type="button" role="radio" data-format="matrix">Matrix</button>
					<button type="button" role="radio" data-format="sections">Sections</button>
					<button type="button" role="radio" data-format="progress">Progress</button>
					<button type="button" role="radio" data-format="board">Board</button>
					<button type="button" role="radio" data-format="weekrows">Week rows</button>
					<button type="button" role="radio" data-format="habit">Habit</button>
				</div>

				<div id="output" data-anim></div>
			</div>
		</section>
	</main>
</div>

<!-- Plan detail -->
<div class="sheet" id="plan-sheet" aria-hidden="true">
	<div class="sheet-backdrop" data-close-sheet></div>
	<section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="plan-sheet-title">
		<button type="button" class="icon-btn sheet-close" data-close-sheet aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
		<div class="sheet-cover" id="plan-sheet-cover"></div>
		<div class="sheet-body">
			<h2 id="plan-sheet-title"></h2>
			<p class="muted" id="plan-sheet-blurb"></p>
			<ul class="facts" id="plan-sheet-facts"></ul>
			<div class="first-reading" id="plan-sheet-first"></div>
			<div class="sheet-actions">
				<button type="button" class="btn btn-primary btn-lg" id="plan-sheet-start">Start plan</button>
				<button type="button" class="btn btn-ghost btn-lg" id="plan-sheet-customize">Customize</button>
			</div>
			<p class="fine" id="plan-sheet-note"></p>
		</div>
	</section>
</div>

<!-- Display options -->
<div class="sheet" id="display-sheet" aria-hidden="true">
	<div class="sheet-backdrop" data-close-sheet></div>
	<section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="display-sheet-title">
		<button type="button" class="icon-btn sheet-close" data-close-sheet aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
		<div class="sheet-body">
			<h2 id="display-sheet-title">Display</h2>
			<div class="rows">
				<label class="row"><span>Checkboxes</span><span data-slot="options-checkbox"></span></label>
				<label class="row"><span>Section colors</span><span data-slot="options-sectioncolors"></span></label>
				<label class="row"><span>Hide dates</span><span data-slot="options-nodates"></span></label>
				<label class="row"><span>Plan stats</span><span data-slot="options-stats"></span></label>
				<label class="row"><span>Daily stats</span><span data-slot="options-dailystats"></span></label>
			</div>
			<div class="rows">
				<label class="row"><span>Language</span><span data-slot="options-language"></span></label>
				<label class="row"><span>Bible site</span><span data-slot="options-urlsite"></span></label>
				<label class="row"><span>Translation</span><span data-slot="options-urlversion"></span></label>
			</div>
		</div>
	</section>
</div>

<!-- Save / export -->
<div class="sheet" id="export-sheet" aria-hidden="true">
	<div class="sheet-backdrop" data-close-sheet></div>
	<section class="sheet-panel sheet-panel-sm" role="dialog" aria-modal="true" aria-labelledby="export-sheet-title">
		<button type="button" class="icon-btn sheet-close" data-close-sheet aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
		<div class="sheet-body">
			<h2 id="export-sheet-title">Save your plan</h2>
			<div class="action-list">
				<button type="button" class="action" data-export="print"><svg class="icon"><use href="#i-print"/></svg><span><strong>Print</strong><small>Or save as PDF</small></span></button>
				<button type="button" class="action" data-export="ics"><svg class="icon"><use href="#i-calendar"/></svg><span><strong>Add to calendar</strong><small>.ics file</small></span></button>
				<button type="button" class="action" data-export="csv"><svg class="icon"><use href="#i-table"/></svg><span><strong>Spreadsheet</strong><small>.csv file</small></span></button>
				<button type="button" class="action" data-export="link"><svg class="icon"><use href="#i-external"/></svg><span><strong>Copy link</strong><small>Share this plan</small></span></button>
			</div>
		</div>
	</section>
</div>

<!-- Reading -->
<div class="sheet" id="reading-modal" aria-hidden="true">
	<div class="sheet-backdrop reading-modal-backdrop" data-reading-close></div>
	<section class="sheet-panel sheet-panel-lg reading-modal-panel" role="dialog" aria-modal="true" aria-labelledby="reading-modal-title">
		<header class="reading-head">
			<h2 id="reading-modal-title">Reading</h2>
			<div class="reader-tools" role="group" aria-label="Text settings">
				<button type="button" class="icon-btn reader-size" data-reader="smaller" aria-label="Smaller text"><span class="glyph-sm" aria-hidden="true">A</span></button>
				<button type="button" class="icon-btn reader-size" data-reader="larger" aria-label="Larger text"><span class="glyph-lg" aria-hidden="true">A</span></button>
				<button type="button" class="icon-btn reader-wide" data-reader="wide" aria-pressed="false" aria-label="Wide layout"><svg class="icon"><use href="#i-wide"/></svg></button>
			</div>
			<a id="reading-modal-link" class="btn btn-quiet" href="#" target="_blank" rel="noopener"><svg class="icon"><use href="#i-external"/></svg><span>Open</span></a>
			<button type="button" class="icon-btn" id="reading-modal-close" aria-label="Close reading" data-reading-close><svg class="icon"><use href="#i-close"/></svg></button>
		</header>
		<div id="reading-modal-content" tabindex="0"></div>
	</section>
</div>

<button type="button" class="to-top" aria-label="Back to top" hidden><svg class="icon"><use href="#i-up"/></svg></button>

<div class="toast" role="status" aria-live="polite"></div>

<!-- The plan engine reads its settings from this form. The app writes to it; it is never shown. -->
<div id="engine" hidden>
<nav id="settings">
			<section class="decision" id="section-time">
				<header>
					<h2>Time Frame</h2>
				</header>
						
				<div class="decision-body">				
					<label for="time-startdate">Start:</label> 	<input type="date" id="time-startdate" placeholder="Start Date" />
					<label for="time-days">Days:</label> 	<input type="number" id="time-days" placeholder="Days in plan" />
				</div>
			</section>
			
			<section class="decision" id="section-format">
				<header>
					<h2>Format</h2>
				</header>
				
				<div class="decision-body">
					<select id="options-language">
						<option value="en">English</option>
						<option value="de">Deutsch (German)</option>
						<option value="es">español (Spanish)</option>
						<option value="fi">Finnish (Suomalainen)</option>
						<option value="fr">le français (French)</option>
						<option value="id">Indonesia (Indonesian)</option>
						<option value="po">Português (Portuguese)</option>
						<option value="ru">Ру́сский (Russia)</option>
						<option value="sv">svenska (Swedish)</option>	
						<option value="tr">Türkçe (Turkish)</option>
						<option value="uk">українська (Ukrainian)</option>
						<option value="ar">العَرَبِيَّة‎ (Arabic)</option>
						<option value="bn">বাংলা (Bengali)</option>
						<option value="zh-CN">汉语 (Chinese Simplified)</option>
						<option value="zh-TW">漢語 (Chinese Traditional)</option>	
						<option value="el">Ελληνικά (Greek)</option>	
						<option value="iw">עִברִית (Hebrew)</option>												
						<option value="hi">हिन्दी (Hindi)</option>
						<option value="jv">ꦧꦱꦗꦮ (Javanese)</option>
						<option value="ko">한국어 (Korean)</option>
						<option value="ml">മലയാളം (Malayalam)</option>
						<option value="ja">日本 (Japanese)</option>
						<option value="ko">한국어 (Korean)</option>
						<option value="mr">मराठी (Marathi)</option>	
						<option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>						
						<option value="ta">தமிழ் (Tamil)</option>
						<option value="te">తెలుగు (Telugu)</option>
						<option value="ur">اردو (Urdu)</option>
					</select>
					
					<label>
						<input type="radio" id="formatstyle-calendar" name="formatstyle" value="calendar" >
						Calendar
					</label>

					<label>
						<input type="radio" id="formatstyle-list" name="formatstyle" value="list">
						List
					</label>
					
					<label>
						<input type="radio" id="formatstyle-weeks" name="formatstyle" value="weeks">
						Weeks
					</label>

					<label>
						<input type="radio" id="formatstyle-books" name="formatstyle" value="books">
						Books
					</label>	
					
					<label>
						<input type="radio" id="formatstyle-books" name="formatstyle" value="circle">
						Circle (Slices)
					</label>	

					<label>
						<input type="radio" id="formatstyle-books" name="formatstyle" value="circlecal">
						Circle (Calendar)
					</label>
					<label>
						<input type="radio" name="formatstyle" value="matrix">
						Matrix
					</label>
					<label>
						<input type="radio" name="formatstyle" value="sections">
						Sections
					</label>
					<label>
						<input type="radio" name="formatstyle" value="progress">
						Progress
					</label>
					<label>
						<input type="radio" name="formatstyle" value="board">
						Board
					</label>
					<label>
						<input type="radio" name="formatstyle" value="weekrows">
						Week rows
					</label>
					<label>
						<input type="radio" name="formatstyle" value="habit">
						Habit
					</label>					
				</div>
			</section>				
			
			<section class="decision" id="section-books">
				<header>
					<h2>Bible Books</h2>
				</header>
				
				<div class="decision-body">
					
					<div class="order-traditional order-group">
						<label><input type="radio" name="bibleorder" value="traditional">Traditional</label>
						
						<details class="section-OT">
							<summary>
								<label class="books-testament"><input type="checkbox" value="OT">Old Testament</label>
							</summary>

							<div class="books-list">						
								
							</div>						
						</details>						

						<details class="section-DC">
							<summary>
								<label class="books-testament"><input type="checkbox" value="DC">Deuterocanonical</label>
							</summary>

							<div class="books-list">						
								
							</div>						
						</details>						
						
						<details class="section-NT">
							<summary>
								<label class="books-testament"><input type="checkbox" value="NT">New Testament</label>
							</summary>

							<div class="books-list">
													
							</div>
						</details>
					</div>
					
					
					<div class="order-chronological order-group">
						<br>
						<label><input type="radio" name="bibleorder" value="chronological" >Chronological</label>
						<br>
						<label class="books-testament"><input type="checkbox" class="section-ot" value="OT">Old Testament</label>
						<br>
						<label class="books-testament"><input type="checkbox" class="section-nt" value="NT" >New Testament</label>
					</div>


					<div class="order-alternate order-group">
						<br>
						<label><input type="radio" name="bibleorder" value="alternate">Alternate</label>
						
						<details class="section-OT">
							<summary>
								<label class="books-testament"><input type="checkbox" value="OT">Hebrew Tanakh</label>
							</summary>

							<div class="books-list">						
								
							</div>						
						</details>	
						
						<details class="section-NT">
							<summary>
								<label class="books-testament"><input type="checkbox" value="NT">Gospel Writers</label>
							</summary>

							<div class="books-list">						
								
							</div>						
						</details>							

					</div>	


					<div class="order-mcheyne order-group">
						<br>
						<label><input type="radio" name="bibleorder" value="mcheyne" >M'Cheyne</label>						
					</div>	
					
					<div id="divide-by">
						<label>Divide by
							<select id="options-logic">
								<option value="chapters" >Number of Chapters</option>
								<option value="words" selected>Words per Chapter</option>
								<option value="pericopes">Pericopes</option>
							</select>
						</label> 										
					</div>
				</div>
			</section>	
			
					
			<section class="decision" id="section-days">
				<header>
					<h2>Days of the Week</h2>
				</header>
				
				<div class="decision-body">								
					<label><input type="checkbox" id="days-1" value="1">Sunday</label>
